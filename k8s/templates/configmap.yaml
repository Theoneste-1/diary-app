apiVersion: v1
kind: ConfigMap
metadata:
  name: mydiary-config
  namespace: {{ .Values.namespace }}
data:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_TYPE: "redis"
  JWT_EXPIRATION_MINUTES: "1440"
  SEED_ENABLED: {{ .Values.backend.seedEnabled | quote }}
  PORT: "8080"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError"
