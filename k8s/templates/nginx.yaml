apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      server_tokens off;
      upstream mydiary_frontend { server frontend:3000; }
      upstream mydiary_backend { server backend:8080; }
      server {
        listen 80;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /api { proxy_pass http://mydiary_backend; proxy_set_header Host $host; }
        location ^~ /api/ {
          proxy_pass http://mydiary_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
        }
        location / {
          proxy_pass http://mydiary_frontend;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector: { app: nginx }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.service.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx }
  template:
    metadata:
      labels: { app: nginx }
    spec:
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
{{ toYaml .Values.resources.nginx | indent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: nginx-config }
