
---
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Set SELinux to permissive immediately
  ansible.builtin.command: setenforce 0
  when: ansible_selinux.status == "enabled"
        and ansible_selinux.mode == "enforcing"
  changed_when: true

- name: Configure SELinux permanently
  ansible.builtin.replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=.*$'
    replace: 'SELINUX=permissive'

- name: Create Kubernetes kernel modules configuration
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: '0644'

- name: Apply kernel networking settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Verify swap is disabled
  ansible.builtin.command: swapon --show
  register: swap_status
  changed_when: false
  failed_when: swap_status.stdout | length > 0

- name: Verify IP forwarding
  ansible.builtin.command: sysctl net.ipv4.ip_forward
  register: ip_forward
  changed_when: false
  failed_when: "'= 1' not in ip_forward.stdout"
