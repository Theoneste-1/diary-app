
---
# Common preparation for all Kubernetes nodes
# Target OS: AlmaLinux 9

- name: Install basic system utilities
  ansible.builtin.dnf:
    name:
      - chrony
      - curl
      - wget
      - tar
      - socat
      - conntrack-tools
      - iproute-tc
    state: present

- name: Enable time synchronization
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

- name: Disable active swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true

- name: Configure required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'

- name: Load overlay kernel module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure Kubernetes networking parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: '0644'

- name: Apply sysctl configuration
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
